# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable parallel builds
org.gradle.parallel=true

# Enable configuration cache for faster builds
org.gradle.configuration-cache=true

# Enable build caching
org.gradle.caching=true

# Kotlin code style
kotlin.code.style=official

# =============================================================================
# CI OPTIMIZATIONS
# =============================================================================

# Disable daemon in CI environments (faster startup, predictable builds)
# Set via environment: CI=true ./gradlew ...
org.gradle.daemon=${CI:false}

# CI-specific JVM args (less aggressive GC for CI environments)
org.gradle.jvmargs.ci=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# =============================================================================
# BUILD CACHE (Local only - no remote cache to avoid costs)
# =============================================================================

# Build cache is enabled locally (free)
# No remote cache to keep costs at $0

# =============================================================================
# TEST REPORTING
# =============================================================================

# Generate JUnit XML reports for CI integration
org.gradle.test.reporting.junitXml.enabled=true

# Generate HTML test reports
org.gradle.test.reporting.html.enabled=true

# =============================================================================
# PUBLISHING CONFIGURATION
# =============================================================================

