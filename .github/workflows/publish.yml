---
# Maven Central upload. Invoked by release-please after a tag
# is created, or manually from master via workflow_dispatch.
# Secrets: MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD,
# SIGNING_KEY, SIGNING_PASSWORD
name: Publish

"on":
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Release tag created by release-please
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: >
      github.event_name == 'workflow_call' ||
      github.ref == 'refs/heads/master'
    runs-on: macos-latest
    environment: maven-central
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername:
            ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword:
            ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey:
            ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword:
            ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_SIGNING_ENABLED: "true"
        run: >
          ./gradlew
          :annotations:publishAndReleaseToMavenCentral
          :mappergen:publishAndReleaseToMavenCentral
